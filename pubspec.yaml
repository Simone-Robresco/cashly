name: cashly
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # iOS Icons
  cupertino_icons: ^1.0.8

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # State Management
  provider: ^6.1.1

  # Charts
  fl_chart: ^0.66.0

  # Local Storage
  shared_preferences: ^2.3.2

  # UI & Design
  google_fonts: ^6.3.0
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  smooth_page_indicator: ^1.2.1
  animations: ^2.0.11
  shimmer: ^3.0.0
  flutter_svg: ^2.2.0
  lottie: ^3.3.2
  cached_network_image: ^3.4.1
  flex_color_scheme: ^8.2.0
  glassmorphism: ^3.0.0
  gap: ^3.0.1
  iconsax_flutter: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true